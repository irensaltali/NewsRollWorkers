version: v2
name: newsroll_visual_v2
data:
  item_table:
    name: newsroll_items
    type: table
  interaction_table:
    name: newsroll_interactions
    type: table
index:
  lexical_search:
    item_fields:
      - headline
      - title
      - category
      - topics
  embeddings:
    - name: content_embedding
      encoder:
        type: hugging_face
        model_name: sentence-transformers/all-MiniLM-L6-v2
        batch_size: 256
        item_fields:
          - headline
          - title
          - category
          - topics
          - media_type
training:
  models:
    - name: two_tower
      policy_type: two-tower
